plugins { id 'com.android.application'; id 'com.chaquo.python' }

android {
    namespace 'org.flowseal.tgws.android'
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'org.flowseal.tgws.android'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.11.4-android.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

def syncCore = tasks.register('syncProxyCore', Sync) {
    from('../..') { include 'proxy/**'; include 'LICENSE' }
    into layout.buildDirectory.dir('python-core')
}
chaquopy {
    defaultConfig {
        version = '3.13'
        pip { install 'certifi==2026.10.23'; install 'httpx[http2]==0.28.1' }
    }
    sourceSets { main { srcDir layout.buildDirectory.dir('python-core') } }
}
tasks.configureEach { if (name == 'generateDebugPythonAssets' || name == 'generateReleasePythonAssets' || name.endsWith('PythonSources')) dependsOn(syncCore) }
dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
